<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Survaidr. You survey. We report. Coming soon.">
    <meta name="theme-color" content="#000000">
    <title>Survaidr — Coming soon</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        background: #000;
        color: #00d3a2;
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: 100%;
        max-width: 960px;
        text-align: center;
      }

      h1 {
        margin: 0;
      }

      img {
        display: block;
        width: 100%;
        height: auto;
      }

      p {
        margin: 24px 0 0;
        font-size: clamp(16px, 2.5vw, 20px);
        font-weight: 400;
        letter-spacing: 0.12em;
      }

      .contact {
        margin-top: 40px;
      }

      .contact h2 {
        margin: 0 0 16px;
        color: #999;
        font-size: 14px;
        font-weight: 400;
        line-height: 20px;
      }

      .contact a {
        color: #fff;
        font-size: 16px;
        line-height: 24px;
        text-decoration: none;
        text-underline-offset: 4px;
      }

      .contact a:hover,
      .contact a:focus-visible {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>
        <img
          src="assets/survaidr-logo.png"
          alt="Survaidr — You survey. We report."
          width="2172"
          height="724"
        >
      </h1>
      <p>Coming soon...</p>
      <section class="contact" aria-labelledby="contact-heading">
        <h2 id="contact-heading">Get in touch</h2>
        <a href="mailto:hello@survaidr.ie">hello@survaidr.ie</a>
      </section>
    </main>
  </body>
</html>
